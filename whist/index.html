<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Whist · 6 jucători</title><style>*{box-sizing:border-box}body{margin:0;background:#101521;color:#f3f5fb;font:13px -apple-system,BlinkMacSystemFont,Arial,sans-serif}main{max-width:900px;margin:auto;padding:10px}header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}h1{font-size:20px;margin:0}button{background:#314c86;color:white;border:1px solid #5a77ae;border-radius:8px;padding:9px 12px;font-weight:700}button.danger{background:#78363d}table{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:1px;text-align:center}th,td{padding:3px 0;background:#1d2637;border-radius:3px}thead th{background:#2b3b58}th.round{width:24px;font-size:10px}th.player{font-size:clamp(8px,2.5vw,13px);overflow:hidden;text-overflow:clip}th.sub{font-size:10px}td.score{font-size:11px;font-weight:800;background:#26364b}td.round{font-weight:700;color:#d4e4ff;font-size:11px}input{display:block;width:100%;min-width:0;height:28px;padding:0;border:1px solid #43516c;border-radius:3px;background:#111b2a;color:#fff;text-align:center;font-size:14px;appearance:none;-webkit-appearance:none}input:focus{outline:2px solid #82b5ff}tr.current td{background:#273d50}.tot td{background:#344e6d;font-weight:800;font-size:12px}#msg{font-size:11px;color:#afbed7;margin:8px 0}#dialog{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:24px}#dialog.show{display:flex}.modal{background:#202d43;padding:22px;border-radius:14px;max-width:340px;width:100%;text-align:center}.actions{display:flex;justify-content:center;gap:10px;margin-top:18px}small{color:#a8b6d0}@media(max-width:420px){main{padding:5px}table{border-spacing:1px}th.round{width:19px}th.player{font-size:9px}th.sub{font-size:9px}td{padding:2px 0}input{height:26px;font-size:13px}button{padding:8px}}</style></head><body><main><header><div><h1>WHIST</h1><small>6 jucători · 30 runde</small></div><button id="newGame">Joc nou</button></header><div id="msg">L = licitat · F = făcut · P = punctaj automat</div><table id="board"><thead id="head"></thead><tbody id="body"></tbody><tfoot id="foot"></tfoot></table></main><div id="dialog"><div class="modal"><h2>Începi un joc nou?</h2><p>Se șterg toate licitațiile și rezultatele. Numele rămân.</p><div class="actions"><button id="cancel">Anulează</button><button class="danger" id="confirm">Șterge scorurile</button></div></div></div><script>(function(){'use strict';const names=['Mihai','Axinte','Stanciu','Mimi','Georgi','Laura'];const rounds=[...Array(6).fill(1),2,3,4,5,6,7,...Array(6).fill(8),7,6,5,4,3,2,...Array(6).fill(1)];const key='whist6_2026_v2';let data=[];try{let v=JSON.parse(localStorage.getItem(key));if(Array.isArray(v)&&v.length===30)data=v}catch(e){}if(!data.length)data=rounds.map(()=>names.map(()=>({l:'',f:''})));const head=document.getElementById('head'),body=document.getElementById('body'),foot=document.getElementById('foot');head.innerHTML='<tr><th class="round" rowspan="2">Nr.</th>'+names.map(n=>'<th class="player" colspan="3">'+n+'</th>').join('')+'</tr><tr>'+names.map(()=>'<th class="sub">L</th><th class="sub">F</th><th class="sub">P</th>').join('')+'</tr>';function points(o){if(o.l===''||o.f==='')return null;const l=Number(o.l),f=Number(o.f);return l===f?5+l:-Math.abs(l-f)}function save(){try{localStorage.setItem(key,JSON.stringify(data))}catch(e){}}function totals(){data.forEach((row,r)=>row.forEach((o,p)=>{const cell=document.getElementById('score-'+r+'-'+p);if(cell){const v=points(o);cell.textContent=v===null?'':(v>0?'+'+v:String(v));cell.style.color=v===null?'':v>=0?'#a5efbf':'#ff9e9e'}}));let sums=names.map(()=>0);data.forEach(row=>row.forEach((o,i)=>{let p=points(o);if(p!==null)sums[i]+=p}));foot.innerHTML='<tr class="tot"><td>Total</td>'+sums.map(v=>'<td colspan="3">'+v+'</td>').join('')+'</tr>';document.querySelectorAll('tbody tr').forEach((tr,r)=>{tr.classList.toggle('current',data[r].some(o=>o.l!==''||o.f!=='')&&!data[r].every(o=>points(o)!==null));});}function render(){body.innerHTML='';rounds.forEach((cards,r)=>{const tr=document.createElement('tr');const num=document.createElement('td');num.className='round';num.textContent=cards;tr.appendChild(num);names.forEach((_,p)=>{['l','f'].forEach(k=>{const td=document.createElement('td'),inp=document.createElement('input');inp.type='number';inp.inputMode='numeric';inp.min='0';inp.max=String(cards);inp.value=data[r][p][k];inp.setAttribute('aria-label',names[p]+' runda '+(r+1)+' '+(k==='l'?'licitație':'făcut'));inp.addEventListener('input',()=>{const v=inp.value;data[r][p][k]=v===''?'':String(Math.max(0,Math.min(cards,Math.trunc(Number(v)||0))));save();totals()});inp.addEventListener('change',()=>{inp.value=data[r][p][k]});td.appendChild(inp);tr.appendChild(td)});const score=document.createElement('td');score.className='score';score.id='score-'+r+'-'+p;tr.appendChild(score)});body.appendChild(tr)});totals()}const dialog=document.getElementById('dialog');document.getElementById('newGame').addEventListener('click',()=>dialog.classList.add('show'));document.getElementById('cancel').addEventListener('click',()=>dialog.classList.remove('show'));document.getElementById('confirm').addEventListener('click',()=>{data=rounds.map(()=>names.map(()=>({l:'',f:''})));save();render();dialog.classList.remove('show');window.scrollTo(0,0)});render()})();</script></body></html>
